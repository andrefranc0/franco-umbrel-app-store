version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: calibre-web_server_1
      APP_PORT: 8083

  server:
    image: crocodilestick/calibre-web-automated:latest
    stop_grace_period: 1m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      - HARDCOVER_TOKEN=eyJhbGciOiJIUzI1NiJ9..r12DxHFiP_RODUe9Ps4qbQ42XzE7LSaKhaR8DEsXdBQ
      # If your library is on a network share (e.g., NFS/SMB), disable WAL to reduce locking issues
      # Accepts: true/false (default: false)
      - NETWORK_SHARE_MODE=false
      # Override the default port (8083) for the web server.
      # Accepts any valid port number.
      - CWA_PORT_OVERRIDE=8083
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/books:/cwa-book-ingest
      - ${APP_DATA_DIR}/data/plugins:/config/.config/calibre/plugins
      - ${APP_DATA_DIR}/data/library:/calibre-library
    ports:
      - 8083:8083
    restart: on-failure
