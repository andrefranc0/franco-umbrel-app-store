version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: franco-francorr_web_1
      APP_PORT: 8090

  web:
    image: python:3.11-slim
    restart: on-failure
    command: >
      sh -c "apt-get update && apt-get install -y ffmpeg &&
             pip install --no-cache-dir fastapi uvicorn discord.py gdown &&
             python /app/main.py"
    environment:
      - DISCORD_TOKEN=${APP_DISCORD_TOKEN}
      - DISCORD_CHANNEL_ID=${APP_DISCORD_CHANNEL_ID}
      - DOWNLOAD_DIR=/downloads
    volumes:
      - ${APP_DATA_DIR}/main.py:/app/main.py
      - ${APP_DATA_DIR}/data:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
