version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: franco-francorr_web_1
      APP_PORT: 8090

  web:
    image: python:3.11-slim
    restart: on-failure
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r /app/requirements.txt &&
             uvicorn main:APP --host 0.0.0.0 --port 8090"
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /app/data
      DOWNLOAD_DIR: /downloads
    volumes:
      - ${APP_DATA_DIR}/main.py:/app/main.py:ro
      - ${APP_DATA_DIR}/requirements.txt:/app/requirements.txt:ro
      - ${APP_DATA_DIR}/data:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
