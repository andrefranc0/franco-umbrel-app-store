version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: always
    ports:
      - "${APP_LIVEKIT_PORT}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    entrypoint:
      - "sh"
      - "-c"
      - |
        # 1. Se o arquivo keys.txt não existir, gera novas chaves e a config
        if [ ! -f /app/keys.txt ]; then
          echo "Gerando novas credenciais do LiveKit..."
          /livekit-server generate-keys > /app/keys.txt
          
          API_KEY=$(head -n 1 /app/keys.txt | awk '{print $2}')
          SECRET_KEY=$(tail -n 1 /app/keys.txt | awk '{print $2}')
          
          # Criamos a configuração em uma única linha estruturada para evitar erros de espaços
          echo "port: 7880" > /app/livekit.yaml
          echo "bind_addresses: ['']" >> /app/livekit.yaml
          echo "keys:" >> /app/livekit.yaml
          echo "  ${API_KEY}: '${SECRET_KEY}'" >> /app/livekit.yaml
          echo "rtc:" >> /app/livekit.yaml
          echo "  tcp_port: 7881" >> /app/livekit.yaml
          echo "  udp_port: 7882" >> /app/livekit.yaml
          echo "  use_external_ip: true" >> /app/livekit.yaml
        fi

        # 2. Lê as chaves diretamente do arquivo de texto bruto (infalível)
        API_KEY_ATUAL=$(head -n 1 /app/keys.txt | awk '{print $2}')
        SECRET_KEY_ATUAL=$(tail -n 1 /app/keys.txt | awk '{print $2}')

        echo "=================================================="
        echo "          CHAVES DE CONEXÃO DO LIVEKIT            "
        echo "=================================================="
        echo " API KEY (TEAMSPEAK 6): $API_KEY_ATUAL"
        echo " SECRET KEY (TEAMSPEAK 6): $SECRET_KEY_ATUAL"
        echo "=================================================="

        # 3. Executa o servidor
        exec /livekit-server --config /app/livekit.yaml
