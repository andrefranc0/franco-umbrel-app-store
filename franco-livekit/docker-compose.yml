version: "3.7"

services:
  app_proxy:
    environment:
      # Ao clicar no atalho no umbrelOS, abre o painel de configuração
      APP_HOST: franco-livekit_panel_1
      APP_PORT: 3000

  # Painel de configuração (Node puro, sem dependências npm).
  # Os arquivos ficam em ${APP_DATA_DIR}/panel (o Umbrel copia a pasta do app).
  panel:
    image: node:20-alpine
    working_dir: /panel
    command: node server.js
    restart: on-failure
    environment:
      APP_ID: franco-livekit
      PORT: 3000
    volumes:
      - ${APP_DATA_DIR}/panel:/panel:ro
      - ${APP_DATA_DIR}/data/config:/config
      # Necessário para o painel reiniciar o container do LiveKit
      - /var/run/docker.sock:/var/run/docker.sock

  livekit:
    image: livekit/livekit-server:v1.9.0
    command: --config /etc/livekit/livekit.yaml
    restart: unless-stopped
    depends_on:
      - panel
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/livekit:ro
