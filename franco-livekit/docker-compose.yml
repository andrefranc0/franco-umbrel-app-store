version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: always
    ports:
      - "${APP_LIVEKIT_PORT}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    entrypoint:
      - "sh"
      - "-c"
      - |
        # Força a remoção do yaml antigo corrompido para não quebrar mais a inicialização
        if [ -f /app/livekit.yaml ]; then
          rm -f /app/livekit.yaml
        fi

        # Se o keys.txt não existir, gera as novas credenciais
        if [ ! -f /app/keys.txt ]; then
          echo "Gerando chaves oficiais do LiveKit..."
          /livekit-server generate-keys > /app/keys.txt
        fi

        # Extrai as chaves geradas
        API_KEY=$(head -n 1 /app/keys.txt | awk '{print $2}')
        SECRET_KEY=$(tail -n 1 /app/keys.txt | awk '{print $2}')

        # Escreve a configuração no formato JSON (Elimina qualquer erro de espaço ou indentação do YAML)
        cat <<EOF > /app/livekit.json
        {
          "port": 7880,
          "bind_addresses": [""],
          "keys": {
            "${API_KEY}": "${SECRET_KEY}"
          },
          "rtc": {
            "tcp_port": 7881,
            "udp_port": 7882,
            "use_external_ip": true
          }
        }
        EOF

        echo "=================================================="
        echo "          CHAVES DE CONEXÃO DO LIVEKIT            "
        echo "=================================================="
        echo " API KEY (TEAMSPEAK 6): $API_KEY"
        echo " SECRET KEY (TEAMSPEAK 6): $SECRET_KEY"
        echo "=================================================="

        # Executa o servidor apontando para o arquivo JSON estruturado
        exec /livekit-server --config /app/livekit.json
