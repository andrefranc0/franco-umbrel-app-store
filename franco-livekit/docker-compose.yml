version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: always
    command: --bind 0.0.0.0 --rtc-port-tcp 7881 --rtc-port-udp 7882 --use-external-ip
    ports:
      - "${APP_LIVEKIT_PORT}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    environment:
      # Pega de forma segura o que foi digitado na tela do seu Umbrel
      - LIVEKIT_KEYS=${INPUT_LIVEKIT_API_KEY}:${INPUT_LIVEKIT_SECRET_KEY}
