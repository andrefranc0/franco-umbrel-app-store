version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: always
    ports:
      - "${APP_LIVEKIT_PORT}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    entrypoint:
      - "sh"
      - "-c"
      - |
        # 1. Se o arquivo não existir, gera um arquivo de chaves nativo e o config base
        if [ ! -f /app/livekit.yaml ]; then
          echo "Gerando chaves e configurações pela primeira vez..."
          
          # O próprio LiveKit gera o par de chaves perfeitamente formatado para nós
          /livekit-server generate-keys > /app/keys.txt
          
          # Extrai as chaves geradas para variáveis do shell
          API_KEY=$(head -n 1 /app/keys.txt | awk '{print $2}')
          SECRET_KEY=$(tail -n 1 /app/keys.txt | awk '{print $2}')
          
          # Cria o arquivo de configuração perfeitamente indentado
          cat <<EOF > /app/livekit.yaml
        port: 7880
        bind_addresses:
          - ''
        keys:
          ${API_KEY}: '${SECRET_KEY}'
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        EOF
        fi

        # 2. Lê e exibe as chaves diretamente do arquivo gerado para o console de forma limpa
        API_KEY_ATUAL=$(grep -A 1 'keys:' /app/livekit.yaml | tail -n 1 | cut -d':' -f1 | tr -d ' ')
        SECRET_KEY_ATUAL=$(grep -A 1 'keys:' /app/livekit.yaml | tail -n 1 | cut -d"'" -f2)

        echo "=================================================="
        echo "          CHAVES DE CONEXÃO DO LIVEKIT            "
        echo "=================================================="
        echo " API KEY (TEAMSPEAK 6): $API_KEY_ATUAL"
        echo " SECRET KEY (TEAMSPEAK 6): $SECRET_KEY_ATUAL"
        echo "=================================================="

        # 3. Executa o servidor usando a configuração criada
        exec /livekit-server --config /app/livekit.yaml
