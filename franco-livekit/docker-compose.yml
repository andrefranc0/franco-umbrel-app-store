version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    restart: always
    ports:
      - "${APP_LIVEKIT_PORT}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/app
    entrypoint:
      - "sh"
      - "-c"
      - |
        # 1. Remove qualquer arquivo yaml residual antigo
        if [ -f /app/livekit.yaml ]; then
          rm -f /app/livekit.yaml
        fi

        # 2. Se o keys.txt não existir, gera chaves alfanuméricas puras de alta segurança
        if [ ! -f /app/keys.txt ]; then
          echo "Gerando credenciais limpas para o LiveKit..."
          NEW_API_KEY=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 16)
          NEW_SECRET_KEY=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 32)
          
          # Salva em texto puro para persistência e consultas futuras
          echo "$NEW_API_KEY" > /app/keys.txt
          echo "$NEW_SECRET_KEY" >> /app/keys.txt
        fi

        # 3. Lê as chaves salvas sem nenhuma interferência de formatação
        API_KEY=$(head -n 1 /app/keys.txt)
        SECRET_KEY=$(tail -n 1 /app/keys.txt)

        # 4. Sobrescreve o arquivo JSON com as credenciais válidas
        cat <<EOF > /app/livekit.json
        {
          "port": 7880,
          "bind_addresses": [""],
          "keys": {
            "${API_KEY}": "${SECRET_KEY}"
          },
          "rtc": {
            "tcp_port": 7881,
            "udp_port": 7882,
            "use_external_ip": true
          }
        }
        EOF

        echo "=================================================="
        echo "          CHAVES DE CONEXÃO DO LIVEKIT            "
        echo "=================================================="
        echo " API KEY (TEAMSPEAK 6): $API_KEY"
        echo " SECRET KEY (TEAMSPEAK 6): $SECRET_KEY"
        echo "=================================================="

        # 5. Executa o servidor LiveKit
        exec /livekit-server --config /app/livekit.json
