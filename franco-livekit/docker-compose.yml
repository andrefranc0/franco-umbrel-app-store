version: "3.7"

services:
  livekit:
    image: livekit/livekit-server:v1.8.0
    command: --config /app/livekit.yaml
    restart: always
    ports:
      # Porta HTTP/WebSocket para o TeamSpeak se conectar
      - "${APP_LIVEKIT_PORT}:7880"
      # Portas WebRTC para transmissão de áudio/vídeo
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/app
