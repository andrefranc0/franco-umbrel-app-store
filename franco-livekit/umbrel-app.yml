manifestVersion: 1
id: franco-livekit
category: developer
name: LiveKit
version: "1.9.0"
tagline: Servidor WebRTC open source para áudio, vídeo e dados em tempo real
description: >-
  LiveKit é uma infraestrutura WebRTC escalável para aplicações de áudio,
  vídeo e dados em tempo real.


  Esta versão inclui um painel de configuração que abre ao clicar no ícone do
  app no umbrelOS. Por ele você cria, gera, edita e remove as chaves de API
  (API key / API secret) e aplica as mudanças reiniciando o servidor, sem
  precisar editar arquivos por SSH.


  Portas expostas na rede local: 7880 (sinalização HTTP/WebSocket),
  7881 (RTC sobre TCP) e 7882 UDP (RTC sobre UDP). Para uso pela internet,
  libere essas portas no seu roteador.
